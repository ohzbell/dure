<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>찬양 진행</title>
  <link rel="stylesheet" href="now.css?v=48">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"></noscript>
</head>
<body>
  <div id="player-mount"><div id="yt"></div><div id="yt-next"></div></div>
  <div id="veil"></div>
  <div id="show">
    <iframe id="canva" title="설교 슬라이드" hidden allow="fullscreen" allowfullscreen></iframe>
    <header class="show-top">
      <button class="nav" type="button" id="page-prev" aria-label="이전 페이지">‹</button>
      <div class="titles">
        <h1 id="page-title"></h1>
        <p id="page-sub"></p>
      </div>
      <button class="nav" type="button" id="page-next" aria-label="다음 페이지">›</button>
    </header>
    <main id="stage"></main>
    <p id="count" hidden></p>
    <div class="transport">
      <button type="button" id="play-tip" class="play-tip" hidden>Click to Play</button>
      <button class="icon-btn" type="button" id="play" aria-label="재생">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
      </button>
      <button class="icon-btn" type="button" id="pause" aria-label="일시중지">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg>
      </button>
      <button class="icon-btn" type="button" id="next-track" aria-label="다음 곡">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5v13l9-6.5z"></path><path d="M17 5.5v13"></path></svg>
      </button>
    </div>
    <div class="seek" id="seek" hidden>
      <span class="seek-time" id="seek-time">0:00</span>
      <input id="seek-range" type="range" min="0" max="1000" value="0" step="1" aria-label="재생 시간">
      <span class="seek-time" id="seek-total">0:00</span>
    </div>
    <div class="side-tools">
      <a class="admin-jump icon-btn" href="now.html?desk=1" target="_blank" rel="noopener" aria-label="관리자">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="14.5" r="3.2"></circle><path d="M10.4 13.1 20 5.2"></path><path d="M16.2 7.6 18.4 9.8"></path><path d="M13.6 10 15.8 12.2"></path></svg>
      </a>
      <button class="list-toggle icon-btn" type="button" id="list-toggle" aria-expanded="false" aria-label="영상 리스트">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"></path><path d="M5 12h14"></path><path d="M5 17h14"></path></svg>
      </button>
    </div>
    <aside id="playlist" hidden></aside>
  </div>
  <main id="desk" hidden></main>
  <audio id="cue" preload="auto" src="live-beep.wav?v=5"></audio>
  <script src="now.js?v=56"></script>
</body>
</html>
