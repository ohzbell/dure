<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4efe6">
  <title>두레중 면접 준비</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="hp" aria-hidden="true">
    <label for="fax_number">Fax</label>
    <input id="fax_number" name="fax_number" type="text" tabindex="-1" autocomplete="off">
  </div>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">DURE</p>
        <h1>두레중 면접 준비</h1>
        <p class="lede">두레자연중학교 면접 연습입니다. 아빠, 엄마, 아이가 이름을 고르고 답하고, AI 모범 답변을 옆에 둡니다.</p>
      </div>
      <div class="top-actions">
        <label class="field" for="author-select">작성자
          <select id="author-select"></select>
        </label>
        <div class="admin-actions">
          <button type="button" class="btn btn-ghost" id="admin-open">관리자 로그인</button>
          <label class="ai-toggle" id="ai-toggle" hidden>
            <input type="checkbox" id="ai-toggle-input">
            <span>AI 답변 보기</span>
          </label>
        </div>
      </div>
    </header>
    <p class="notice">답변은 서버에 저장됩니다. 이 주소로 들어오면 같은 답변을 봅니다.</p>
    <div class="data-tools">
      <button type="button" class="btn btn-ghost" id="export-answers">답변 내려받기</button>
      <button type="button" class="btn btn-ghost" id="import-answers">답변 불러오기</button>
      <input id="import-answers-file" type="file" accept="application/json,.json" hidden>
    </div>
    <p class="cooldown" id="cooldown-note" role="status"></p>
    <nav id="area-tabs" class="tabs" role="tablist" aria-label="영역"></nav>
    <main id="main" class="layout">
      <section id="question-list" class="questions" aria-live="polite"></section>
    </main>
  </div>

  <button type="button" class="fab-ref" id="ref-fab" aria-haspopup="dialog" aria-controls="ref-list-modal">
    <span class="fab-ref-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4h8l3 3v13H7z"></path>
        <path d="M14 4v4h4"></path>
        <path d="M10 12h6M10 16h6"></path>
      </svg>
    </span>
    <span class="fab-ref-label">참조</span>
    <span class="fab-ref-count" id="ref-fab-count" hidden>0</span>
  </button>

  <div id="answer-modal" class="modal" hidden>
    <form class="modal-card modal-card-wide" id="answer-form" role="dialog" aria-modal="true" aria-labelledby="answer-modal-title">
      <p class="eyebrow" id="answer-modal-author">답변</p>
      <h2 id="answer-modal-title">답변 작성</h2>
      <p class="muted" id="answer-modal-question"></p>
      <label class="field" for="answer-modal-text">답변
        <textarea id="answer-modal-text" class="textarea" rows="8" maxlength="8000" autocomplete="off"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="answer-modal-close">닫기</button>
        <button type="button" class="btn btn-danger" id="answer-modal-delete" data-guard="cooldown" hidden>삭제</button>
        <button type="submit" class="btn btn-primary" id="answer-modal-save" data-guard="cooldown">저장</button>
      </div>
    </form>
  </div>

  <div id="captcha-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="captcha-title">
      <p class="eyebrow">확인</p>
      <h2 id="captcha-title">저장 전 덧셈 확인</h2>
      <p class="muted">자동 입력과 도배를 거르기 위한 짧은 확인입니다.</p>
      <p id="captcha-question" class="captcha-q"></p>
      <label class="field" for="captcha-answer">정답
        <input id="captcha-answer" inputmode="numeric" autocomplete="off">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="captcha-cancel">취소</button>
        <button type="button" class="btn btn-primary" id="captcha-submit">확인 후 저장</button>
      </div>
    </div>
  </div>

  <div id="ref-list-modal" class="modal" hidden>
    <div class="modal-card modal-sheet" role="dialog" aria-modal="true" aria-labelledby="ref-list-title">
      <p class="eyebrow">참조</p>
      <h2 id="ref-list-title">이 영역의 자료</h2>
      <p class="muted" id="ref-list-note">읽을 자료를 고르세요.</p>
      <div id="ref-list-body" class="ref-pick-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="ref-list-close">닫기</button>
      </div>
    </div>
  </div>

  <div id="ref-modal" class="modal" hidden>
    <div class="modal-card modal-sheet modal-card-wide" role="dialog" aria-modal="true" aria-labelledby="ref-modal-title">
      <p class="eyebrow">참조</p>
      <h2 id="ref-modal-title">자료</h2>
      <div id="ref-modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="ref-modal-back">목록</button>
        <button type="button" class="btn btn-primary" id="ref-modal-close">닫기</button>
      </div>
    </div>
  </div>

  <div id="login-modal" class="modal" hidden>
    <form class="modal-card" id="login-form" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <p class="eyebrow">관리자</p>
      <h2 id="login-title">관리 모드</h2>
      <p class="muted">질문과 참조를 고치려면 관리자 계정으로 들어가세요.</p>
      <label class="field" for="login-id">아이디
        <input id="login-id" name="username" autocomplete="username" required>
      </label>
      <label class="field" for="login-password">비밀번호
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="field" for="login-captcha">덧셈 정답
        <span id="login-captcha-label"></span>
        <input id="login-captcha" inputmode="numeric" autocomplete="off" required>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="login-cancel">취소</button>
        <button type="submit" class="btn btn-primary">들어가기</button>
      </div>
    </form>
  </div>

  <section id="admin" class="admin" hidden>
    <div class="admin-inner">
      <header class="admin-bar">
        <div>
          <p class="eyebrow">관리</p>
          <h2>질문과 참조</h2>
        </div>
        <div class="row">
          <button type="button" class="btn btn-ghost" id="admin-close">보드로</button>
          <button type="button" class="btn btn-ghost" id="admin-logout">로그아웃</button>
        </div>
      </header>
      <div id="admin-root"></div>
    </div>
  </section>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>
  <noscript><p class="notice">이 보드는 자바스크립트가 필요합니다.</p></noscript>
  <script src="app.js?v=3"></script>
</body>
</html>
