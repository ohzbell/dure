<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>뽑기 · Praise Festival 2026</title>
  <link rel="stylesheet" href="festival.css?v=11">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"></noscript>
</head>
<body data-page="draw">
  <div class="top-tools">
    <a class="home-link" href="go.html" aria-label="처음 화면">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2"></path><path d="M7 10.2V20h10V10.2"></path></svg>
    </a>
    <button class="back-link" type="button" id="go-back" aria-label="뒤로 가기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg>
    </button>
    <a class="draw-link" href="draw.html" aria-label="뽑기" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.15"></circle><circle cx="12" cy="12" r="1.15"></circle><circle cx="16" cy="16" r="1.15"></circle></svg>
    </a>
  </div>
  <main id="stage" class="stage stage-draw"></main>
  <div class="draw-foot">
    <p id="draw-hint">Draw를 눌러 뽑습니다</p>
    <button id="reset-draw" type="button">초기화</button>
  </div>
  <button id="start-draw" class="draw-start" type="button">Draw</button>
  <div class="corner-tools">
    <a class="score-link" href="score.html" aria-label="점수 기록">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="16" rx="2"></rect><path d="M9 4h6v3H9z"></path><path d="M9 11h6M9 15h4"></path></svg>
    </a>
    <a class="result-link" href="result.html" aria-label="결과">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10"></path><path d="M12 19V5"></path><path d="M19 19v-7"></path></svg>
    </a>
    <button class="admin-link" type="button" id="admin-open" aria-label="관리자">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="14.5" r="3.2"></circle><path d="M10.4 13.1 20 5.2"></path><path d="M16.2 7.6 18.4 9.8"></path><path d="M13.6 10 15.8 12.2"></path></svg>
    </button>
  </div>
  <script src="festival.js?v=12"></script>
</body>
</html>
